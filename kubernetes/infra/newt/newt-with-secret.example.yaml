apiVersion: v1
kind: Namespace
metadata:
  name: pangolin
  labels:
    app.kubernetes.io/managed-by: kubectl
    # hostNetwork + NET_ADMIN für WireGuard zwingend nötig → privileged
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
---
apiVersion: v1
kind: Secret
metadata:
  name: newt-credentials
  namespace: pangolin
type: Opaque
stringData:
  NEWT_ID: "CHANGE_ME"
  NEWT_SECRET: "CHANGE_ME"
  PANGOLIN_ENDPOINT: "https://pangolin.example.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: newt
  namespace: pangolin
  labels:
    app: newt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: newt
  template:
    metadata:
      labels:
        app: newt
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      containers:
        - name: newt
          image: fosrl/newt:latest
          imagePullPolicy: Always
          env:
            - name: NEWT_ID
              valueFrom:
                secretKeyRef:
                  name: newt-credentials
                  key: NEWT_ID
            - name: NEWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: newt-credentials
                  key: NEWT_SECRET
            - name: PANGOLIN_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: newt-credentials
                  key: PANGOLIN_ENDPOINT
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
              drop:
                - ALL
            allowPrivilegeEscalation: false
            privileged: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep newt"
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: newt-egress
  namespace: pangolin
spec:
  podSelector:
    matchLabels:
      app: newt
  policyTypes:
    - Egress
    - Ingress
  egress:
    - ports:
        - port: 51820
          protocol: UDP
        - port: 21820
          protocol: UDP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
  ingress:
    - {}
