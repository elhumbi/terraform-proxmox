apiVersion: v1
kind: Namespace
metadata:
  name: hotrod

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotrod
  namespace: hotrod
  labels:
    app: hotrod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hotrod
  template:
    metadata:
      labels:
        app: hotrod
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hotrod
          image: jaegertracing/example-hotrod:latest
          imagePullPolicy: IfNotPresent
          args: ["all"]
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy-collector.monitoring.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: "hotrod"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=homelab,service.namespace=hotrod"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: hotrod
  namespace: hotrod
  labels:
    app: hotrod
spec:
  type: ClusterIP
  selector:
    app: hotrod
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hotrod
  namespace: hotrod
  annotations:
    cert-manager.io/cluster-issuer: internal-ca-issuer
spec:
  ingressClassName: cilium
  tls:
    - hosts:
        - hotrod.home.local
      secretName: hotrod-tls
  rules:
    - host: hotrod.home.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hotrod
                port:
                  number: 8080
