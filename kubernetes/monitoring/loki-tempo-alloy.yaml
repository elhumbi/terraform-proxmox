---
# ============================================================
# ALLOY RBAC (geteilt von beiden Alloy-Instanzen)
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: monitoring

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
      - pods/log
      - namespaces
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: monitoring

---
# ============================================================
# ALLOY-LOGS CONFIG (DaemonSet)
# Liest Pod-Logs direkt vom Filesystem (/var/log/pods).
# Jedes DaemonSet-Pod sammelt nur Logs vom eigenen Node
# (spec.nodeName Filter via NODE_NAME env var).
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-logs-config
  namespace: monitoring
data:
  config.alloy: |
    // =========================================================
    // Kubernetes Pod-Discovery — nur Pods auf diesem Node
    // NODE_NAME wird als fieldRef im DaemonSet gesetzt
    // =========================================================
    discovery.kubernetes "pods" {
      role = "pod"
      selectors {
        role  = "pod"
        field = "spec.nodeName=" + env("NODE_NAME")
      }
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      // Pfad zur Log-Datei aus Pod-Metadaten bauen:
      // /var/log/pods/<namespace>_<pod>_<uid>/<container>/*.log
      rule {
        source_labels = [
          "__meta_kubernetes_namespace",
          "__meta_kubernetes_pod_name",
          "__meta_kubernetes_pod_uid",
          "__meta_kubernetes_pod_container_name",
        ]
        separator    = "/"
        regex        = "(.+)/(.+)/(.+)/(.+)"
        replacement  = "/var/log/pods/$1_$2_$3/$4/*.log"
        target_label = "__path__"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }
      rule {
        target_label = "node"
        replacement  = env("NODE_NAME")
      }
      rule {
        target_label = "cluster"
        replacement  = "homelab"
      }
      // Pods ohne laufende Container überspringen
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        action        = "drop"
        regex         = "Pending|Succeeded|Failed|Unknown"
      }
    }

    local.file_match "pod_logs" {
      path_targets = discovery.relabel.pod_logs.output
    }

    loki.source.file "pod_logs" {
      targets    = local.file_match.pod_logs.targets
      forward_to = [loki.process.parse_cri.receiver]
    }

    // CRI-Format parsen (containerd): timestamp stream flags message
    loki.process "parse_cri" {
      stage.cri {}
      forward_to = [loki.write.loki.receiver]
    }

    loki.write "loki" {
      endpoint {
        url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
      }
      external_labels = {
        cluster = "homelab",
      }
    }

    // =========================================================
    // Hubble Flow Logs — Cilium schreibt JSON nach
    // /var/run/cilium/hubble/events.log (hostPath-Mount)
    // =========================================================
    local.file_match "hubble_flows" {
      path_targets = [{
        "__path__" = "/var/run/cilium/hubble/events.log",
        "job"      = "hubble-flows",
        "node"     = env("NODE_NAME"),
        "cluster"  = "homelab",
      }]
    }

    loki.source.file "hubble_flows" {
      targets    = local.file_match.hubble_flows.targets
      forward_to = [loki.process.parse_hubble.receiver]
    }

    loki.process "parse_hubble" {
      // Hubble exportiert flow als nested object: {"flow": {"verdict": ..., "source": {"namespace": ...}}}
      // Alloy stage.json nutzt dot-notation für nested paths
      stage.json {
        expressions = {
          verdict           = "flow.verdict",
          traffic_direction = "flow.traffic_direction",
          source_namespace  = "flow.source.namespace",
          dest_namespace    = "flow.destination.namespace",
          source_pod        = "flow.source.pod_name",
          dest_pod          = "flow.destination.pod_name",
          drop_reason       = "flow.drop_reason_desc",
        }
      }
      // Nur verdict + Namespaces als Labels — Pods bleiben im Log (hohe Kardinalität)
      stage.labels {
        values = {
          verdict               = "verdict",
          traffic_direction     = "traffic_direction",
          source_namespace      = "source_namespace",
          destination_namespace = "dest_namespace",
        }
      }
      forward_to = [loki.write.loki.receiver]
    }

---
# ============================================================
# ALLOY-LOGS DAEMONSET
# Läuft auf jedem Node (inkl. control-plane).
# Braucht root um /var/log/pods zu lesen (Talos: root-owned).
# Namespace hat pod-security: privileged - kein PSS-Problem.
# ============================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy-logs
  namespace: monitoring
  labels:
    app: alloy-logs
spec:
  selector:
    matchLabels:
      app: alloy-logs
  template:
    metadata:
      labels:
        app: alloy-logs
    spec:
      serviceAccountName: alloy
      tolerations:
        - operator: Exists   # alle Nodes inkl. control-plane
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy
          image: grafana/alloy:v1.8.2
          imagePullPolicy: IfNotPresent
          args:
            - "run"
            - "/etc/alloy/config.alloy"
            - "--storage.path=/tmp/alloy"
            - "--server.http.listen-addr=0.0.0.0:12345"
          ports:
            - name: http-metrics
              containerPort: 12345
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 0   # root nötig für /var/log/pods auf Talos
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: cilium-run
              mountPath: /var/run/cilium
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 12345
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: alloy-logs-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: cilium-run
          hostPath:
            path: /var/run/cilium

---
# ============================================================
# ALLOY-COLLECTOR CONFIG (Deployment)
# OTLP-Receiver für Apps:
#   - Traces  → Tempo
#   - Metriken → Prometheus remote_write
#   - Logs    → Loki
#
# Apps senden an:
#   alloy-collector.monitoring.svc.cluster.local:4317 (gRPC)
#   alloy-collector.monitoring.svc.cluster.local:4318 (HTTP)
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-collector-config
  namespace: monitoring
data:
  config.alloy: |
    // =========================================================
    // Kubernetes Events → Loki
    // Nur hier (nicht im DaemonSet), sonst mehrfach gesendet
    // =========================================================
    loki.source.kubernetes_events "cluster_events" {
      forward_to = [loki.write.loki.receiver]
    }

    // =========================================================
    // OTLP Receiver
    // =========================================================
    otelcol.receiver.otlp "default" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }
      output {
        traces  = [otelcol.exporter.otlp.tempo.input]
        metrics = [otelcol.exporter.prometheus.prom.input]
        logs    = [otelcol.exporter.loki.loki.input]
      }
    }

    // =========================================================
    // Traces → Tempo
    // =========================================================
    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "tempo.monitoring.svc.cluster.local:4317"
        tls {
          insecure = true
        }
      }
    }

    // =========================================================
    // Metriken → Prometheus remote_write
    // Setzt remote-write-receiver auf Prometheus voraus
    // (enableFeatures: [remote-write-receiver] in der CRD)
    // =========================================================
    otelcol.exporter.prometheus "prom" {
      forward_to = [prometheus.remote_write.default.receiver]
    }

    prometheus.remote_write "default" {
      endpoint {
        url = "http://prometheus-operated.monitoring.svc.cluster.local:9090/api/v1/write"
      }
    }

    // =========================================================
    // Logs → Loki
    // =========================================================
    otelcol.exporter.loki "loki" {
      forward_to = [loki.write.loki.receiver]
    }

    loki.write "loki" {
      endpoint {
        url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
      }
      external_labels = {
        cluster = "homelab",
      }
    }

---
# ============================================================
# ALLOY-COLLECTOR DEPLOYMENT
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy-collector
  namespace: monitoring
  labels:
    app: alloy-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alloy-collector
  template:
    metadata:
      labels:
        app: alloy-collector
    spec:
      serviceAccountName: alloy
      securityContext:
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy
          image: grafana/alloy:v1.8.2
          imagePullPolicy: IfNotPresent
          args:
            - "run"
            - "/etc/alloy/config.alloy"
            - "--storage.path=/tmp/alloy"
            - "--server.http.listen-addr=0.0.0.0:12345"
          ports:
            - name: http-metrics
              containerPort: 12345
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 12345
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 12345
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: alloy-collector-config

---
apiVersion: v1
kind: Service
metadata:
  name: alloy-collector
  namespace: monitoring
  labels:
    app: alloy-collector
spec:
  type: ClusterIP
  selector:
    app: alloy-collector
  ports:
    - name: http-metrics
      port: 12345
      targetPort: 12345
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
